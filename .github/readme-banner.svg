<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Daniel Hu, Software and AI Engineer">
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF"/>
      <rect y="5" width="6" height="1" fill="#F1F3F6"/>
    </pattern>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4FB2E6"/>
      <stop offset="0.25" stop-color="#97A6BA"/>
      <stop offset="0.5" stop-color="#EE6FB0"/>
      <stop offset="0.75" stop-color="#97A6BA"/>
      <stop offset="1" stop-color="#4FB2E6"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#A6E6FB"/>
      <stop offset="1" stop-color="#34BEED"/>
    </linearGradient>
    <path id="wave-top" d="M-20 70 C 180 30, 300 150, 520 100 S 860 20, 1000 70 S 1220 110, 1300 60"/>
    <path id="wave-bottom" d="M-20 420 C 200 470, 360 360, 600 410 S 980 470, 1120 405 S 1260 390, 1300 420"/>
    <style>
      text { font-family: 'M PLUS Rounded 1c', 'Arial Rounded MT Bold', 'Nunito', 'Varela Round', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="480" fill="url(#scan)"/>

  <!-- music staff ribbons -->
  <g fill="none" stroke="url(#ink)" stroke-width="2" opacity="0.75">
    <use href="#wave-top"/>
    <use href="#wave-top" transform="translate(0 7)"/>
    <use href="#wave-top" transform="translate(0 14)"/>
    <use href="#wave-top" transform="translate(0 21)"/>
    <use href="#wave-top" transform="translate(0 28)"/>
    <use href="#wave-bottom"/>
    <use href="#wave-bottom" transform="translate(0 7)"/>
    <use href="#wave-bottom" transform="translate(0 14)"/>
    <use href="#wave-bottom" transform="translate(0 21)"/>
    <use href="#wave-bottom" transform="translate(0 28)"/>
  </g>
  <g fill="#EE6FB0" opacity="0.8">
    <ellipse cx="900" cy="58" rx="8" ry="6" transform="rotate(-20 900 58)"/>
    <path d="M907 56 V 26 q 10 4 12 14" fill="none" stroke="#EE6FB0" stroke-width="2.5"/>
  </g>
  <g fill="#97A6BA" opacity="0.8">
    <ellipse cx="300" cy="434" rx="8" ry="6" transform="rotate(-20 300 434)"/>
    <path d="M307 432 V 402" stroke="#97A6BA" stroke-width="2.5"/>
  </g>

  <!-- name, title pill, tagline -->
  <text x="72" y="236" font-size="120" font-weight="800" fill="#3C4046" letter-spacing="-1">Daniel Hu</text>
  <rect x="73.5" y="263.5" width="433" height="61" rx="30.5" fill="url(#pill)" stroke="#1A9CCB" stroke-width="3"/>
  <rect x="88" y="268" width="404" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
  <text x="290" y="305" font-size="29" font-weight="800" fill="#0B3550" text-anchor="middle">Software and AI Engineer</text>
  <text x="74" y="368" font-size="23" font-weight="700" fill="#3C4046">I build AI products that turn messy, high-stakes decisions into clear next steps.</text>

  <!-- DH badge -->
  <circle cx="1130" cy="200" r="66" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="5"/>
  <circle cx="1130" cy="200" r="50" fill="#34BEED"/>
  <text x="1130" y="217" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">DH</text>
</svg>
